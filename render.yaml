# One-click deploy to Render (free tier). Connect the GitHub repo in the Render
# dashboard and it picks this up automatically.
#
# Note on the free plan: the service sleeps after ~15 minutes idle and takes about
# a minute to wake. Open the demo link a couple of minutes before anyone judges it.
services:
  - type: web
    name: filo-asset-sentinel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The public demo runs the AI agent (needs GROQ_API_KEY, set in the dashboard)
      # against dataset-backed CAMARA. The scenario endpoint allows one AI investigation
      # a minute site-wide and 25 a day, so runs stay within the model's free-tier quota.
      - key: AGENT_MODE
        value: llm
      - key: NAC_MODE
        value: mock
      - key: SILENT_THRESHOLD_SECONDS
        value: "12"
      # This service's own public URL, and the only source of the callback sink handed
      # to the operator when registering a CAMARA geofencing subscription. Stated here
      # rather than read from the request, so the URL we put on our Nokia credentials
      # is one we chose and not one a caller wrote into a Host header.
      #
      # Check this against the real hostname after the first deploy: Render appends a
      # suffix when the service name is already taken, and a custom domain replaces it
      # outright — and a wrong value here is a real callback address handed to a real
      # operator. Unset or malformed, nothing is registered and the live-check panel
      # says why, which is the safe direction to fail in.
      #
      # No default, deliberately. The service this repo actually deploys to was created
      # from the dashboard rather than from this blueprint, so it is named nokia-rhhp and
      # the value that used to sit here never reached it. Had it applied, the address was
      # filo-asset-sentinel.onrender.com - not that service's hostname - so the operator
      # would have been handed a callback this app does not own. With sync: false, Render
      # asks for the value when a blueprint creates a service and never overwrites it on a
      # later sync. Set it per service to that service's own URL: for the current
      # deployment, https://nokia-rhhp.onrender.com, in the dashboard.
      - key: PUBLIC_BASE_URL
        sync: false
      # Add in the Render dashboard (never commit these):
      #   GROQ_API_KEY   -> enables AGENT_MODE=llm
      #   NAC_API_KEY    -> enables NAC_MODE=live and the live CAMARA panel
