# Keeps the Render demo awake during a judging window.
#
# Render's free plan sleeps a service after ~15 minutes idle and takes about a
# minute to wake. A judge opening the demo link cold sees a blank tab for that
# minute and may well close it, so during review we poll it instead.
#
# ── Read this before leaving it on ──────────────────────────────────────────
# The free plan includes 750 instance-hours a month. A month is ~730 hours, so a
# service kept awake around the clock consumes essentially the entire allowance
# and the demo goes dark for whatever is left of the month. This is meant to run
# for the days that matter, not permanently.
#
# Turn it off: GitHub → Actions → "Keep demo awake" → ⋯ → Disable workflow.
#
# GitHub also disables scheduled workflows automatically after 60 days without
# repository activity, so it will not run forever unattended.

name: Keep demo awake

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs and often fires them late
    # under load; 10 minutes leaves margin against Render's ~15 minute idle timer.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          # Health only — never a scenario endpoint. Injecting on a timer would
          # spend the agent's rate limit and leave incidents on the board that no
          # human asked for.
          URL: https://nokia-rhhp.onrender.com/api/health
        run: |
          # A sleeping service can take ~60s to answer, and that first slow
          # response IS the wake-up. Retry so a cold start is not read as failure.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "awake (attempt $attempt): $(cat /tmp/body.txt)"
              exit 0
            fi
            echo "attempt $attempt returned $code; retrying in 20s"
            sleep 20
          done
          echo "::warning::demo did not respond after 3 attempts"
          # Do not fail the run: a transient Render blip should not send a red
          # cross to your inbox every ten minutes.
          exit 0
