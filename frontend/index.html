<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Autonomous fleet diagnostics for giga-project sites, built on CAMARA network APIs."
    />
    <title>FILO Asset Sentinel</title>
    <!--
      Served from public/, so these are copied to the dist root and resolve the same
      under the dev server and the single-service deployment. PNG rather than SVG:
      the mark is stripe art, and the small sizes are not straight downscales of the
      large one - they carry an alpha curve that keeps the eye from washing out when
      the stripes average against the gaps between them.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <!--
      Fonts are self-hosted through @fontsource-variable (see src/main.tsx) rather
      than linked from Google Fonts. Two reasons, and the second is the one that
      matters: a demo laptop on venue wifi should not need a third-party request to
      render its own type, and a blocked or slow font host is a layout shift in
      front of judges.
    -->
    <script>
      // Stamp the stored theme before first paint. Without this the app renders
      // light for a frame and then flips, which on a projector reads as a bug.
      (function () {
        try {
          var v = localStorage.getItem("sentinel.theme");
          var resolved =
            v === "light" || v === "dark"
              ? v
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
